# STOCKZ on Hetzner — static desk + same-origin OKX EU relay, private by default.
#
# Why this exists: OKX's EU platform (my.okx.com / eea.okx.com) sends no CORS headers and
# answers 405 to the OPTIONS preflight, so NO browser page may call it directly — from any
# origin, hosted anywhere. The fix is same-origin: this server serves the desk AND forwards
# /okx-eea/... to eea.okx.com. The browser only ever talks to its own origin, so CORS never
# applies at all.
#
# The desk is private infrastructure, closed by three layers:
#   1. basic auth over the WHOLE site — the browser attaches it to same-origin fetches
#      automatically, so the relay is covered without a line of app code;
#   2. no CORS headers anywhere — even with the password, no OTHER website can use the
#      relay from a browser;
#   3. a rate limit on the relay, so a leaked password cannot turn this box into a
#      trading proxy farm.
# The relay stores nothing and holds no secrets: requests arrive already signed, and the
# signing secret never leaves the trader's browser.
#
# One-time setup:
#   apt install nginx certbot python3-certbot-nginx apache2-utils
#   git clone https://github.com/D-dezeeuw/stockz /var/www/stockz
#   htpasswd -c /etc/nginx/stockz.htpasswd danny
#   cp scripts/hetzner/stockz.nginx.conf /etc/nginx/sites-available/stockz
#   ln -s /etc/nginx/sites-available/stockz /etc/nginx/sites-enabled/
#   certbot --nginx -d stockz.YOURDOMAIN.nl        # fills in the ssl_* lines
#   nginx -t && systemctl reload nginx
#
# Deploy stays "push is deploy", no GitHub Actions: the server pulls main once a minute.
#   echo '* * * * * root git -C /var/www/stockz pull --ff-only --quiet' > /etc/cron.d/stockz
#
# In the desk: key modal → tick "OKX EU account" → EU relay: /okx-eea

limit_req_zone $binary_remote_addr zone=okxrelay:1m rate=10r/s;

server {
  listen 80;
  server_name stockz.YOURDOMAIN.nl;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name stockz.YOURDOMAIN.nl;

  # certbot manages these:
  # ssl_certificate     /etc/letsencrypt/live/stockz.YOURDOMAIN.nl/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/stockz.YOURDOMAIN.nl/privkey.pem;

  # Layer 1: the whole desk is password-protected — the app and the relay alike.
  auth_basic "STOCKZ";
  auth_basic_user_file /etc/nginx/stockz.htpasswd;

  root /var/www/stockz;
  index index.html;

  # The OKX EU relay. THE TRAILING SLASHES ARE LOAD-BEARING: with both, nginx maps
  # /okx-eea/api/v5/x to /api/v5/x before forwarding — and /api/v5/x is the exact string
  # the request was signed over, so the venue verifies the signature untouched.
  location /okx-eea/ {
    # Layer 3: enough for one trading desk, nothing like enough for a proxy farm.
    limit_req zone=okxrelay burst=20 nodelay;

    proxy_pass https://eea.okx.com/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host eea.okx.com;
    proxy_set_header Connection "";
    # The venue must not learn this desk's origin, and OKX needs no cookies.
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    # Never buffer or cache signed traffic; never log the query string (bookmark URLs
    # carry credentials as params and must not end up in access logs).
    proxy_buffering off;
    access_log off;
  }

  # The desk itself: raw ES modules straight from the repo, no build step.
  location / {
    try_files $uri $uri/ =404;
    # Modules and JSON change on every deploy; the minute-level pull makes caching stale
    # deploys the only thing a cache would achieve.
    add_header Cache-Control "no-cache";
  }
}
