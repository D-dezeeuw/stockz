<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STOCKZ</title>
  <meta name="description" content="STOCKZ - hyper-scalping micro-trading desk.">
  <meta name="theme-color" content="#0a0e0a">
  <!-- Relative paths: the site is served straight from the repo root, which sits under
       /stockz/ on GitHub Pages. Absolute paths would resolve above that prefix. -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/type.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/grid.css">
  <link rel="stylesheet" href="./src/styles/accents.css">
  <link rel="stylesheet" href="./src/styles/status.css">
  <link rel="stylesheet" href="./src/styles/states.css">
  <link rel="stylesheet" href="./src/styles/utilities.css">

  <!-- The UI engine, straight from the CDN. Pinned to an exact version: the live page
       must never shift under a trader because unpkg published a new minor. The same
       version is a devDependency so Node, Vitest and the Vite dev server resolve the
       identical module. -->
  <script type="importmap">
  {
    "imports": {
      "spektrum":          "https://unpkg.com/spektrum@1.1.0/spektrum.js",
      "spektrum/persist":  "https://unpkg.com/spektrum@1.1.0/companions/spektrum-persist.min.js",
      "spektrum/devtools": "https://unpkg.com/spektrum@1.1.0/companions/spektrum-devtools.min.js",
      "spektrum/inspect":  "https://unpkg.com/spektrum@1.1.0/companions/spektrum-inspect.min.js",
      "spektrum/dock":     "https://unpkg.com/spektrum@1.1.0/companions/spektrum-dock.min.js",
      "spektrum/compile":  "https://unpkg.com/spektrum@1.1.0/companions/spektrum-compile.min.js"
    }
  }
  </script>
  <link rel="modulepreload" href="https://unpkg.com/spektrum@1.1.0/spektrum.js">
</head>
<body>
  <div id="app" class="app-shell" data-cloak>

    <!-- Header. Full contents land in phase 5; the shell and status ticker exist now. -->
    <header class="app-header">
      <span class="status-word t-green">{{app.name}}</span>
      <span class="label">v{{app.version}}</span>
      <span class="grow status-line num truncate">{{ui.statusLine}}</span>
      <span class="price tnum" :class="fmt.cls(trade.dayPnl)">{{fmt.signed(trade.dayPnl)}}</span>
      <span class="label num">{{app.clock}}</span>
    </header>

    <!-- The grid: every cell identical in size, driven entirely by the block registry.
         data-each binds the CONTAINER, and its first child is the repeated template. -->
    <main class="app-grid" data-each="block in settings.blocks">
      <section class="block" :class="block.status === 'error' ? 'block has-error' : 'block'">
        <div class="block__bar">
          <span class="block__title">{{block.title}}</span>
          <span class="block__actions label">{{block.status}}</span>
        </div>
        <div class="block__body">
          <!-- Loading: a shimmer, never a blank cell. A silent empty block looks exactly
               like a market that stopped moving, which is when someone sizes up. -->
          <div class="skeleton" data-if="block.status === 'loading'">
            <span class="skeleton__bar"></span>
            <span class="skeleton__bar"></span>
            <span class="skeleton__bar"></span>
            <span class="skeleton__bar"></span>
          </div>
          <div class="block__state" data-if="block.status === 'empty'">
            <span class="block__state-title">no data</span>
            <span>nothing to show yet</span>
          </div>
          <div class="block__state block__state--error" data-if="block.status === 'error'">
            <span class="block__state-title">error</span>
            <span>{{block.error}}</span>
          </div>
          <div data-if="block.status === 'ready'">
            <p class="label">ready</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Toasts float above the grid. -->
    <ul class="toasts" data-each="toast in ui.toasts">
      <li :class="'toast toast--' + toast.level">{{toast.message}}</li>
    </ul>

    <footer class="app-footer">
      <span class="footer__brand">© <strong>Neko Media</strong></span>
      <nav class="footer__links">
        <a class="footer__link" href="https://www.linkedin.com/in/dannydezeeuw/"
           target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"
               aria-hidden="true"><path d="M2 6 H4.8 V14 H2 Z M3.4 1.6 A1.6 1.6 0 1 1 3.4 4.8 A1.6 1.6 0 1 1 3.4 1.6 Z M6.6 6 H9.3 V7.1 C9.8 6.3 10.8 5.8 12 5.8 C14.2 5.8 15 7.2 15 9.4 V14 H12.2 V9.9 C12.2 8.8 11.8 8.1 10.8 8.1 C9.9 8.1 9.4 8.7 9.4 9.9 V14 H6.6 Z"/></svg>
          linkedin
        </a>
        <a class="footer__link" href="https://www.npmjs.com/package/spektrum"
           target="_blank" rel="noopener noreferrer" aria-label="npm">
          <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"
               aria-hidden="true"><path d="M1 4 H15 V12 H8 V13.5 H4.6 V12 H1 Z M2.6 10.4 H4.3 V6.9 H5.6 V10.4 H7.2 V5.6 H2.6 Z M8.4 5.6 V11.9 H10.1 V10.4 H12.9 V5.6 Z M10.1 6.9 H11.6 V9 H10.1 Z"/></svg>
          npm
        </a>
        <a class="footer__link" href="https://github.com/D-dezeeuw/stockz"
           target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"
               aria-hidden="true"><path d="M8 0.8 A7.2 7.2 0 0 0 5.7 14.8 C6.1 14.9 6.2 14.6 6.2 14.4 V13.1 C4.2 13.5 3.8 12.2 3.8 12.2 C3.5 11.4 3 11.2 3 11.2 C2.4 10.8 3.1 10.8 3.1 10.8 C3.8 10.9 4.1 11.5 4.1 11.5 C4.7 12.6 5.8 12.3 6.2 12.1 C6.3 11.6 6.5 11.3 6.7 11.1 C5.1 10.9 3.4 10.3 3.4 7.5 C3.4 6.7 3.7 6.1 4.1 5.6 C4 5.4 3.8 4.7 4.2 3.7 C4.2 3.7 4.8 3.5 6.2 4.5 A7 7 0 0 1 9.8 4.5 C11.2 3.5 11.8 3.7 11.8 3.7 C12.2 4.7 12 5.4 11.9 5.6 C12.3 6.1 12.6 6.7 12.6 7.5 C12.6 10.3 10.9 10.9 9.3 11.1 C9.6 11.3 9.8 11.8 9.8 12.5 V14.4 C9.8 14.6 9.9 14.9 10.4 14.8 A7.2 7.2 0 0 0 8 0.8 Z"/></svg>
          github
        </a>
      </nav>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
