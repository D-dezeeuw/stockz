name: deploy

# On every push to main, SSH into the Hetzner host and roll the STOCKZ container
# forward. Deployment only, by the owner's explicit call — the full test suite runs
# locally before every merge (see .claude/context/testing-policy.md); this workflow's
# safety is the deploy script's own health gate and automatic rollback.
#
# Requires one repository secret:
#   HETZNER_SSH_KEY — the PRIVATE key whose public half is in the server's
#                     authorized_keys (same host/port/user as newstrader's deploy).

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Never let two deploys run at once; queue them instead of cancelling so a half-applied
# build can't get interrupted mid-rollout.
concurrency:
  group: deploy-hetzner-stockz
  cancel-in-progress: false

env:
  DEPLOY_HOST: 5.9.85.168
  DEPLOY_PORT: "3356"
  DEPLOY_USER: ddezeeuw

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/hetzner
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The host script is root-owned on purpose (a push must never widen what CI runs
      # as root), so it can't be auto-synced — but drift must be LOUD.
      # docker/deploy-stockz.sh is the canonical copy; when the hashes differ, root
      # reinstalls it by hand (command in the script's header).
      - name: Warn when the host deploy script drifts from the repo copy
        run: |
          expected=$(sha256sum docker/deploy-stockz.sh | cut -d' ' -f1)
          actual=$(ssh -i ~/.ssh/hetzner -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sha256sum /nebula/apps/deploy-stockz.sh 2>/dev/null | cut -d" " -f1' \
            || echo unreadable)
          if [ "$expected" != "$actual" ]; then
            echo "::warning title=deploy script drift::/nebula/apps/deploy-stockz.sh does not match docker/deploy-stockz.sh. Reinstall as root: sudo install -o root -g root -m 0755 /nebula/apps/stockz/docker/deploy-stockz.sh /nebula/apps/deploy-stockz.sh"
          else
            echo "host deploy script matches the repo copy ($expected)"
          fi

      - name: Pull & restart
        # Runs a root-owned deploy script the ddezeeuw user may invoke passwordless via
        # /etc/sudoers.d/deploy-stockz. Keeping the privileged work in a fixed,
        # root-owned script (rather than wildcards in sudoers) is why this is safe: a
        # push can't widen what CI may run as root.
        run: |
          ssh -i ~/.ssh/hetzner -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /nebula/apps/deploy-stockz.sh'
